name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to full commit SHAs (not mutable tags) so a
      # compromised or moved tag cannot inject code into CI (#23). The trailing
      # comment records the human-readable version each SHA corresponds to.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Godot
        uses: chickensoft-games/setup-godot@f166999204a4f2722c6fe042fbaa3b3ea0d9c789 # v2.4.1
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: false

      - name: Godot version
        run: godot --version

      # Godot's --import can exit nonzero on benign import-time messages, so we
      # can't assert its exit code directly (hence `|| true`). Instead we delete
      # .godot first so the class cache is ALWAYS freshly regenerated — a stale
      # or corrupt cache from a previous run can never slip past (#22).
      - name: Import project
        run: |
          rm -rf .godot
          timeout 300 godot --headless --path . --import || true

      # `test -s` (exists AND non-empty), so a zero-byte cache from a broken
      # import fails here rather than being treated as a successful build (#22).
      - name: Verify class cache
        run: test -s .godot/global_script_class_cache.cfg || { echo "::error::global class cache missing or empty after import"; exit 1; }

      # Every suite prints a "PASS n / FAIL m" summary, so a naive `grep FAIL`
      # always matches. We match `FAIL: ` (a real failed assert line) or
      # `FAIL [1-9]` (nonzero summary), require a `PASS ` line (else
      # crash/missing-cache), and also honor the process exit code.
      - name: Run core tests
        shell: bash
        run: |
          set -uo pipefail
          set +e   # GitHub's `shell: bash` injects -e; disable it so a failing
                   # test doesn't abort the step before we echo output / aggregate
          fail=0
          shopt -s nullglob
          tests=(src/core/tests/test_*.gd)
          if [ ${#tests[@]} -eq 0 ]; then echo "::error::no test_*.gd found"; exit 1; fi
          for t in "${tests[@]}"; do
            echo "::group::$t"
            out="$(godot --headless --path . --script "res://$t" 2>&1)"
            code=$?
            echo "$out"
            echo "::endgroup::"
            if echo "$out" | grep -Eq 'FAIL: |FAIL [1-9]'; then echo "::error::$t reported FAIL"; fail=1; fi
            if ! echo "$out" | grep -q 'PASS '; then echo "::error::$t produced no PASS summary (crash?)"; fail=1; fi
            if [ "$code" -ne 0 ]; then echo "::error::$t exited $code"; fail=1; fi
          done
          exit "$fail"
